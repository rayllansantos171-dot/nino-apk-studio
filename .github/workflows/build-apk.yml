name: Gerar APK do Nino

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "capacitor.config.ts"
      - "public/**"
      - "package.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Checar tipos do TypeScript (trava o APK se houver erro)
        run: |
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.log || true
          n=$(grep -c 'error TS' tsc.log || true)
          echo "Erros de tipo: $n"
          grep 'error TS' tsc.log | head -30 | while read -r l; do echo "::error::$l"; done
          [ "$n" -eq 0 ]

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Baixar modelo de voz offline em português (Vosk)
        run: |
          mkdir -p android/app/src/main/assets
          curl -fsSL -o /tmp/model-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/model-pt.zip -d /tmp/model-unz
          rm -rf android/app/src/main/assets/model-pt
          mv /tmp/model-unz/vosk-model-small-pt-0.3 android/app/src/main/assets/model-pt
          cat /proc/sys/kernel/random/uuid > android/app/src/main/assets/model-pt/uuid
          du -sh android/app/src/main/assets/model-pt

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nino-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para baixar no celular (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nino-AI.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Nino-AI.apk --target "$GITHUB_SHA" --title "Nino AI (APK mais recente)" --notes "APK de teste gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo Nino-AI.apk e instale no Android."
