<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GERADO a partir de src/nino/components/Nino.tsx + src/nino/styles/animations.css (Nino de verdade, não o robozinho antigo). -->
<style>
:root{--accent:#a855f7;--accent-2:#7c3aed;--accent-soft:#d8b4fe;--pixel:monospace}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
#nino{display:block;width:100%;height:100%}
#nino svg{width:100%;height:100%;overflow:visible}
.nino-wings,.nino-halo{display:none}
body.anjo .nino-wings,body.anjo .nino-halo{display:inline}
.eyes-happy{display:none}
body.happy .eyes-happy{display:inline} body.happy .eyes-normal{display:none}
/* ===== Animações do Nino ===== */
.nino {
  position: relative;
  display: inline-block;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
}
.nino svg g,
.nino svg ellipse {
  transform-box: fill-box;
}
.nino-glow svg {
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 55%, transparent));
}
:root[data-glow="off"] .nino-glow svg {
  filter: none;
}

.nino-all { transform-origin: 50% 100%; }
.nino-head { transform-origin: 50% 100%; }
.nino-arm-l { transform-origin: 50% 8%; }
.nino-arm-r { transform-origin: 50% 8%; }
.nino-leg-l, .nino-leg-r { transform-origin: 50% 0%; }

/* respiração padrão */
.nino-all { animation: breathe 3.2s ease-in-out infinite; }
.nino-screen { animation: screenPulse 2.4s ease-in-out infinite; }
.nino-eyes { animation: blink 5s infinite; transform-origin: 50% 50%; transform-box: fill-box; }

@keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes screenPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

/* partículas */
.nino-particles .p { animation: floatUp 3.6s ease-in-out infinite; }
.nino-particles .p2 { animation-delay: .7s; }
.nino-particles .p3 { animation-delay: 1.4s; }
.nino-particles .p4 { animation-delay: 2.1s; }
.nino-particles .p5 { animation-delay: 2.8s; }
@keyframes floatUp {
  0% { transform: translateY(6px); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-16px); opacity: 0; }
}

/* andar */
.nino-walk .nino-all { animation: bob .5s ease-in-out infinite; }
.nino-walk .nino-leg-l { animation: legA .5s ease-in-out infinite; }
.nino-walk .nino-leg-r { animation: legB .5s ease-in-out infinite; }
.nino-walk .nino-arm-l { animation: legB .5s ease-in-out infinite; }
.nino-walk .nino-arm-r { animation: legA .5s ease-in-out infinite; }

/* correr */
.nino-run .nino-all { animation: bob .28s ease-in-out infinite; transform: rotate(6deg); }
.nino-run .nino-leg-l { animation: legA2 .28s ease-in-out infinite; }
.nino-run .nino-leg-r { animation: legB2 .28s ease-in-out infinite; }
.nino-run .nino-arm-l { animation: legB2 .28s ease-in-out infinite; }
.nino-run .nino-arm-r { animation: legA2 .28s ease-in-out infinite; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes legA { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
@keyframes legB { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
@keyframes legA2 { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(-38deg); } }
@keyframes legB2 { 0%,100% { transform: rotate(-38deg); } 50% { transform: rotate(38deg); } }

/* pular */
.nino-jump .nino-all { animation: jump 0.7s ease-in-out infinite; }
.nino-jump .nino-arm-l { transform: rotate(-35deg); }
.nino-jump .nino-arm-r { transform: rotate(35deg); }
.nino-jump .nino-shadow { animation: shadowJump .7s ease-in-out infinite; transform-origin: center; }
@keyframes jump { 0%,100% { transform: translateY(0) scaleY(.95); } 45% { transform: translateY(-26px) scaleY(1.04); } }
@keyframes shadowJump { 0%,100% { transform: scale(1); opacity: .35; } 45% { transform: scale(.6); opacity: .15; } }

/* acenar */
.nino-wave .nino-arm-r { animation: wave .55s ease-in-out infinite; transform: rotate(150deg); }
@keyframes wave { 0%,100% { transform: rotate(135deg); } 50% { transform: rotate(175deg); } }

/* dançar */
.nino-dance .nino-all { animation: dance .6s ease-in-out infinite; }
.nino-dance .nino-arm-l { animation: armUpL .6s ease-in-out infinite; }
.nino-dance .nino-arm-r { animation: armUpR .6s ease-in-out infinite; }
.nino-dance .nino-head { animation: headBop .6s ease-in-out infinite; }
@keyframes dance { 0%,100% { transform: translate(-3px,0) rotate(-3deg); } 50% { transform: translate(3px,-5px) rotate(3deg); } }
@keyframes armUpL { 0%,100% { transform: rotate(-140deg); } 50% { transform: rotate(-90deg); } }
@keyframes armUpR { 0%,100% { transform: rotate(90deg); } 50% { transform: rotate(140deg); } }
@keyframes headBop { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

/* sentado */
.nino-sit .nino-all { animation: none; transform: translateY(14px); }
.nino-sit .nino-leg-l { transform: rotate(-82deg) translate(-4px, 2px); }
.nino-sit .nino-leg-r { transform: rotate(82deg) translate(4px, 2px); }

/* em pânico (ao ser arrastado) */
.nino-panic .nino-all { animation: shake .18s linear infinite; }
.nino-panic .nino-arm-l { transform: rotate(-40deg); }
.nino-panic .nino-arm-r { transform: rotate(40deg); }
@keyframes shake { 0%,100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }

/* olhando ao redor */
.nino-look .nino-head { animation: look 2.4s ease-in-out infinite; }
.nino-look .nino-eyes { animation: none; }
@keyframes look { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateX(-2px); } 70% { transform: rotate(6deg) translateX(2px); } }

/* notas musicais e exclamação */
.nino .note {
  position: absolute;
  color: var(--accent-soft);
  font-weight: 700;
  font-size: 22px;
  pointer-events: none;
  text-shadow: 0 0 8px var(--accent);
}
.nino .n1 { left: -4px; top: 6%; animation: noteFloat 1.2s ease-in-out infinite; }
.nino .n2 { right: -2px; top: 18%; animation: noteFloat 1.2s ease-in-out .5s infinite; }
.nino .n3 { right: 0; top: -2%; font-size: 28px; animation: shake .25s linear infinite; }
@keyframes noteFloat { 0% { transform: translateY(8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-12px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .nino *, .nino { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* ===== Personalidade e física ===== */
.nino-flip { width: 100%; height: 100%; }

/* pendurado (segurado no ar) */
.nino-hang .nino-all { transform-origin: 50% 0; animation: hangSway 1.3s ease-in-out infinite; }
.nino-hang .nino-arm-l { transform: rotate(160deg); }
.nino-hang .nino-arm-r { transform: rotate(-160deg); }
.nino-hang .nino-leg-l { animation: dangleA 1.1s ease-in-out infinite; }
.nino-hang .nino-leg-r { animation: dangleB 1.1s ease-in-out infinite; }
@keyframes hangSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes dangleA { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }
@keyframes dangleB { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* caindo */
.nino-fall .nino-all { animation: tumble .5s linear infinite; }
.nino-fall .nino-arm-l { animation: flailL .16s linear infinite; }
.nino-fall .nino-arm-r { animation: flailR .16s linear infinite; }
.nino-fall .nino-leg-l { animation: legA2 .2s linear infinite; }
.nino-fall .nino-leg-r { animation: legB2 .2s linear infinite; }
@keyframes tumble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes flailL { 0%,100% { transform: rotate(-150deg); } 50% { transform: rotate(-110deg); } }
@keyframes flailR { 0%,100% { transform: rotate(150deg); } 50% { transform: rotate(110deg); } }

/* pouso (achatado) */
.nino-land .nino-all { animation: squash .26s ease-out 1; transform-origin: 50% 100%; }
@keyframes squash { 0% { transform: scale(1.18, .72); } 100% { transform: scale(1, 1); } }

/* levou pancada */
.nino-hurt .nino-all { animation: hurtShake .12s linear infinite; }
.nino-hurt .nino-arm-l { transform: rotate(-35deg); }
.nino-hurt .nino-arm-r { transform: rotate(35deg); }
@keyframes hurtShake { 0%,100% { transform: translateX(-2px) rotate(-3deg); } 50% { transform: translateX(2px) rotate(3deg); } }
.nino-flash svg { animation: flashRed .38s ease-out 1; }
@keyframes flashRed {
  0%, 60% { filter: brightness(1.7) sepia(1) hue-rotate(-50deg) saturate(5) drop-shadow(0 0 14px #ff3355); }
  100% { filter: none; }
}

/* tonto */
.nino-dazed .nino-head { animation: dizzyHead 1s ease-in-out infinite; }
.nino-dazed .nino-all { animation: dizzyBody 1.4s ease-in-out infinite; }
@keyframes dizzyHead { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
@keyframes dizzyBody { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
.dizzy-stars {
  position: absolute; left: 50%; top: -4%; width: 90%; margin-left: -45%; text-align: center;
  color: #ffe066; font-size: 16px; letter-spacing: 6px; text-shadow: 0 0 8px #facc15; pointer-events: none;
  animation: starOrbit 1s linear infinite;
}
@keyframes starOrbit { 0% { transform: translateX(-10px) scale(1); } 50% { transform: translateX(10px) scale(.8); opacity: .6; } 100% { transform: translateX(-10px) scale(1); } }

/* nocauteado (deitado) */
.nino-ko .nino-flip svg { transform-origin: 50% 100%; transform: translate(-22%, -26%) rotate(90deg); }
.nino-ko .nino-all { animation: none; }
.nino-ko .nino-arm-l, .nino-ko .nino-arm-r { transform: rotate(20deg); }
.nino-ko .dizzy-stars { top: 38%; }
.nino-getup .nino-flip svg { animation: getUp .65s ease-out 1; transform-origin: 50% 100%; }
@keyframes getUp { 0% { transform: translate(-22%, -26%) rotate(90deg); } 100% { transform: translate(0, 0) rotate(0); } }

/* dormindo */
.nino-sleep .nino-all { animation: sleepBreath 3.4s ease-in-out infinite; transform: translateY(14px); }
.nino-sleep .nino-leg-l { transform: rotate(-82deg) translate(-4px, 2px); }
.nino-sleep .nino-leg-r { transform: rotate(82deg) translate(4px, 2px); }
.nino-sleep .nino-head { transform: rotate(14deg) translateY(4px); }
@keyframes sleepBreath { 0%,100% { transform: translateY(14px) scale(1); } 50% { transform: translateY(15px) scale(1.01, 1.015); } }
.nino .n4 { right: 6%; top: 8%; font-family: var(--pixel); font-size: 16px; animation: noteFloat 1.8s ease-in-out infinite; }

/* chorando */
.nino-cry .nino-all { animation: sob .32s linear infinite; }
.nino-cry .nino-arm-l { transform: rotate(150deg); }
.nino-cry .nino-arm-r { transform: rotate(-150deg); }
@keyframes sob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px) scaleY(.98); } }
.tear { animation: tearDrop 1s linear infinite; }
.tear2 { animation-delay: .5s; }
@keyframes tearDrop { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(5px); opacity: 0; } }

/* bravo (batendo o pé) */
.nino-stomp svg { filter: drop-shadow(0 0 10px #ff5a7a); }
.nino-stomp .nino-all { animation: stompBody .3s ease-in-out infinite; }
.nino-stomp .nino-leg-l { animation: stompL .3s ease-in-out infinite; }
.nino-stomp .nino-leg-r { animation: stompR .3s ease-in-out infinite; }
.nino-stomp .nino-arm-l { transform: rotate(8deg); }
.nino-stomp .nino-arm-r { transform: rotate(-8deg); }
@keyframes stompBody { 0%,100% { transform: translate(-1px, 0); } 50% { transform: translate(1px, 2px); } }
@keyframes stompL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-20deg); } }
@keyframes stompR { 0%,100% { transform: rotate(-20deg); } 50% { transform: rotate(0); } }

/* rindo / feliz */
.nino-laugh .nino-all { animation: laugh .35s ease-in-out infinite; }
.nino-laugh .nino-head { transform: rotate(-6deg); }
@keyframes laugh { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.nino-eyes-love { animation: lovePulse .8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes lovePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.nino-eyes-dizzy { animation: spinEyes 1s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes spinEyes { to { transform: rotate(360deg); } }

/* girar (vira de frente para trás várias vezes) */
.nino-spin .nino-all { animation: spinTurn .6s linear infinite; }
@keyframes spinTurn { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }

/* cambalhota */
.nino-backflip .nino-all { animation: backflip .95s ease-in-out 1; transform-origin: 50% 55%; }
.nino-backflip .nino-arm-l { transform: rotate(-60deg); }
.nino-backflip .nino-arm-r { transform: rotate(60deg); }
@keyframes backflip { 0% { transform: rotate(0); } 100% { transform: rotate(-360deg); } }

/* palmas */
.nino-clap .nino-all { animation: laugh .5s ease-in-out infinite; }
.nino-clap .nino-arm-l { animation: clapL .3s ease-in-out infinite; }
.nino-clap .nino-arm-r { animation: clapR .3s ease-in-out infinite; }
@keyframes clapL { 0%,100% { transform: rotate(-125deg); } 50% { transform: rotate(-95deg); } }
@keyframes clapR { 0%,100% { transform: rotate(125deg); } 50% { transform: rotate(95deg); } }

/* mostrar os músculos */
.nino-flex .nino-all { animation: flexPulse .7s ease-in-out infinite; }
.nino-flex .nino-arm-l { transform: rotate(-100deg); }
.nino-flex .nino-arm-r { transform: rotate(100deg); }
@keyframes flexPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06, 1.03); } }

/* reverência */
.nino-bow .nino-all { animation: bow 1.8s ease-in-out 1; transform-origin: 50% 100%; }
@keyframes bow { 0%,100% { transform: rotate(0); } 30%,70% { transform: rotate(16deg) translateY(4px); } }

/* pensando */
.nino-think .nino-head { animation: thinkTilt 1.6s ease-in-out infinite; }
.nino-think .nino-arm-r { transform: rotate(155deg); }
@keyframes thinkTilt { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

/* Nino parado: só o Nino ativado (flutuante) e a cena de defesa se mexem; os demais ficam em pose fixa. */
.nino-still,
.nino-still * { animation: none !important; transition: none !important; }
.nino-still .nino-particles,
.nino-still .note,
.nino-still .dizzy-stars { display: none; }

/* skin Anjo: asas batem devagar, brilho suave na auréola; parado (nino-still) tudo fica fixo */
.nino-wing { animation: wingFlap 1.6s ease-in-out infinite; }
.nino-wing-l { transform-origin: 100% 12%; }
.nino-wing-r { transform-origin: 0% 12%; animation-name: wingFlapR; }
.nino-jump .nino-wing, .nino-fall .nino-wing, .nino-backflip .nino-wing, .nino-hang .nino-wing { animation-duration: .35s; }
.nino-run .nino-wing { animation-duration: .6s; }
.nino-sleep .nino-wing, .nino-ko .nino-wing { animation: none; }
.nino-halo { animation: haloGlow 2.2s ease-in-out infinite; filter: drop-shadow(0 0 4px #ffd24d); }
@keyframes wingFlap { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-11deg); } }
@keyframes wingFlapR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(11deg); } }
@keyframes haloGlow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

</style></head>

<script>
window.setSkin=function(k){document.body.classList.toggle('anjo',k==='anjo')};
setSkin((location.hash||'').slice(1));
var HAPPY={jump:1,backflip:1,dance:1,wave:1,spin:1};
window.setState=function(s,flip){
  var a=s==='drag'?'hang':s;
  document.getElementById('nino').className='nino nino-'+a+' nino-glow';
  document.body.classList.toggle('happy',!!HAPPY[s]);
  document.getElementById('flip').style.transform=flip?'scaleX(-1)':'';
};
</script></body></html>
