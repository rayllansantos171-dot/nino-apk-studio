<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nino offline</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#120d22;color:#eee;display:flex;flex-direction:column;height:100vh}
header{padding:12px;text-align:center}
iframe{border:0;width:110px;height:110px;background:transparent}
#log{flex:1;overflow:auto;padding:12px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0}
.u{background:#7c5cff;margin-left:auto}.n{background:#2a2145}
form{display:flex;gap:8px;padding:10px}
input{flex:1;padding:10px;border-radius:20px;border:0;background:#2a2145;color:#fff}
button{border:0;border-radius:20px;padding:0 16px;background:#7df9ff;color:#120d22;font-weight:bold}
</style></head><body>
<header><iframe src="nino-overlay.html" id="f"></iframe><div>Nino (modo offline)</div></header>
<div id="log"><div class="b n">Estou sem internet, mas continuo aqui! 💜 Fala comigo.</div></div>
<form id="fm"><input id="i" placeholder="Digite..." autocomplete="off"><button>Enviar</button></form>
<script>
const R=[[/oi|ola|eai/,["Oi! 👋 Que bom te ver!","Olá! Tudo certo por aí?"]],
[/criou|criador|papai|rayllan/,["Quem me criou foi o Rayllan Santos, meu papai! 💜 Ele é de Ubatuba, SP."]],
[/piada/,["Por que o computador foi ao médico? Porque estava com vírus! 😂","O que o zero disse pro oito? Que cinto bonito! 😄"]],
[/hora/,[()=>"Agora são "+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+" ⏰"]],
[/triste|mal/,["Ei, vai ficar tudo bem. Tô aqui com você 💜"]],
[/proposito|quem e voce/,["Sou o Nino, seu agente de IA! Quando a internet voltar, fico ainda mais esperto ⚡"]]];
const D=["Hmm, interessante! Me conta mais 🤔","Sem internet eu sei menos coisas, mas adoro conversar! 😊","Legal! E o que mais?"];
const n=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pick=a=>{const x=a[Math.floor(Math.random()*a.length)];return typeof x=='function'?x():x};
const add=(t,c)=>{const d=document.createElement('div');d.className='b '+c;d.textContent=t;log.appendChild(d);log.scrollTop=1e9};
fm.onsubmit=e=>{e.preventDefault();const t=i.value.trim();if(!t)return;add(t,'u');i.value='';
const r=R.find(([re])=>re.test(n(t)));setTimeout(()=>{add(pick(r?r[1]:D),'n');try{f.contentWindow.setState('wave')}catch(_){}
setTimeout(()=>{try{f.contentWindow.setState('idle')}catch(_){}},1200)},600)};
addEventListener('online',()=>location.href='https://nino-apk-studio.lovable.app');
</script></body></html>
